server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

gateway:
  security:
    auth-validation-url: ${AUTH_VALIDATION_URL:http://authservice-1:8080/api/auth/validate}
    protected-paths:
      - /bff/**
    excluded-paths:
      - /bff/auth/login
      - /bff/auth/register
      - /bff/auth/refresh
      - /bff/system/health
      - /bff/v3/api-docs
      - /bff/docs/**
      - /swagger-ui/**
      - /v3/api-docs/**

spring:
  cloud:
    gateway:
      default-filters:
        - PreserveHostHeader
      routes:
        - id: bff-route
          uri: ${BFF_SERVICE_URL:http://bff-service:8084}
          predicates:
            - Path=/bff/**
